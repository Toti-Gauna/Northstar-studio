name: Northstar verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar_ci_only
          POSTGRES_DB: northstar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northstar" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://northstar:northstar_ci_only@localhost:5432/northstar
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      STORAGE_DIR: ./storage
      STORAGE_DURABLE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northstar-qa
          path: |
            playwright-report
            docs/evidence
          retention-days: 7
