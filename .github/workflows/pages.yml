name: Publish Northstar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /Northstar-studio
      NEXT_PUBLIC_API_URL: ${{ vars.NORTHSTAR_API_URL || 'https://api-not-connected.invalid' }}
      NEXT_PUBLIC_STATIC_PREVIEW: ${{ vars.NORTHSTAR_API_URL && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsx scripts/export-public-catalog.mts
      - run: npm run build -w @northstar/web
      - run: node scripts/static-headers.mjs
        env:
          STATIC_CSP_META: "1"
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
